<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Trace · Local paper studio</title>
  <style>
    :root{--paper:#f2efe7;--surface:#fbfaf6;--ink:#171915;--muted:#6d7269;--line:#d7d2c7;--accent:#ed5b3b;--accent-soft:#f7dcd3;--radius:18px;--shadow:0 30px 90px rgba(35,32,24,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}a{color:inherit}.shell{min-height:100vh}.topbar{position:sticky;top:0;z-index:30;height:66px;padding:0 max(22px,4vw);display:flex;align-items:center;gap:24px;background:rgba(242,239,231,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em}.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}.local{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:18px}.tabs{display:flex;align-items:center;gap:4px;margin-left:auto}.tabs button{border:0;background:transparent;border-radius:999px;padding:9px 15px;color:var(--muted);cursor:pointer}.tabs button.active{background:var(--ink);color:white}.download{margin-left:8px;text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-size:12px}.view{display:none}.view.active{display:block}.hero{min-height:78vh;padding:9vh max(24px,7vw) 7vh;display:flex;flex-direction:column;justify-content:space-between;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;line-height:1.4;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}.hero h1{font:500 clamp(52px,8vw,126px)/.88 Georgia,serif;letter-spacing:-.06em;max-width:1200px;margin:28px 0}.hero .dek{font:400 clamp(19px,2.1vw,31px)/1.45 Georgia,serif;color:#454a43;max-width:860px}.meta{display:flex;justify-content:space-between;gap:24px;margin-top:60px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}.lab{max-width:1280px;margin:auto;padding:90px max(22px,5vw)}.section-head{display:grid;grid-template-columns:150px 1fr;gap:30px;margin-bottom:35px}.section-head h2{font:500 clamp(34px,5vw,66px)/1 Georgia,serif;letter-spacing:-.04em;margin:0}.thesis{font:400 clamp(25px,3vw,44px)/1.3 Georgia,serif;letter-spacing:-.025em;max-width:1040px;margin:0 0 90px}.summary-grid,.tri-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-bottom:100px}.summary-grid article,.tri-grid article{padding:30px;border-right:1px solid var(--line)}.summary-grid article:first-child,.tri-grid article:first-child{padding-left:0}.summary-grid article:last-child,.tri-grid article:last-child{border:0}.summary-grid h3,.tri-grid h3{font:500 26px Georgia,serif;margin:12px 0}.summary-grid p,.tri-grid li{line-height:1.65;color:#4f554d}.tri-grid ul{padding-left:18px}.claims{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:100px}.claim{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px}.claim header{display:flex;justify-content:space-between;gap:15px;margin-bottom:25px}.tag{font-size:9px;letter-spacing:.12em;text-transform:uppercase}.verified{color:#377356}.review{color:#9b5e25}.claim p{font:19px/1.5 Georgia,serif}.claim details{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}.claim summary{cursor:pointer}.claim blockquote{margin:12px 0 0;border-left:2px solid var(--accent);padding-left:14px;line-height:1.55}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:100px}.metric{border-top:2px solid var(--ink);padding:18px 0}.metric b{font:54px Georgia,serif;color:var(--accent)}.metric strong,.metric small{display:block;margin-top:8px}.metric small{color:var(--muted)}.report{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.report article{padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}.report h3{font:500 30px/1.1 Georgia,serif;margin:12px 0}.report p,.report li{line-height:1.65;color:#4d534b}.open{margin-top:12px;padding:34px;border-radius:var(--radius);background:var(--ink);color:white}.open ol{columns:2;gap:45px}.open li{margin-bottom:12px;line-height:1.5}.story-grid{display:grid;grid-template-columns:minmax(340px,.78fr) minmax(500px,1.22fr);max-width:1500px;margin:auto}.story-copy{padding:0 5vw}.story-section{min-height:100vh;padding:27vh 0 22vh;opacity:.38;transition:.35s}.story-section.active{opacity:1}.story-section .number{font:italic 23px Georgia,serif;color:var(--accent)}.story-section h2{font:500 clamp(36px,4.2vw,64px)/1 Georgia,serif;letter-spacing:-.045em;margin:17px 0 25px}.story-section>.body{font:18px/1.75 Georgia,serif;color:#454b43}.story-section details{font-size:12px;color:var(--muted);padding:12px 0;border-top:1px solid var(--line)}.story-section summary{cursor:pointer}.story-sticky{position:sticky;top:66px;height:calc(100vh - 66px);padding:6vh 4vw;display:grid;place-items:center}.visual-slot{grid-area:1/1;width:100%;opacity:0;transform:translateY(12px);pointer-events:none;transition:.4s}.visual-slot.active{opacity:1;transform:none}.mobile-visual{display:none}.figure{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.figure>header{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.figure>header i{width:7px;height:7px;border-radius:50%;background:var(--accent)}.canvas{min-height:480px;padding:38px;display:grid;place-items:center}.figure>footer{padding:14px 21px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.v-metric{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.v-metric span{padding:20px;border-left:1px solid var(--line)}.v-metric b{display:block;font:46px Georgia,serif;color:var(--accent)}.v-metric strong,.v-metric small,.v-flow strong,.v-flow small,.v-concept strong,.v-concept small,.v-architecture span>*{display:block}.v-metric small,.v-flow small,.v-concept small,.v-architecture small,.v-equation small,.v-timeline small,.v-info small{color:var(--muted);margin-top:7px}.v-flow,.v-timeline{display:flex;width:100%}.v-flow span,.v-timeline span{flex:1;padding:18px;border-top:2px solid var(--line)}.v-flow i,.v-timeline i{display:block;color:var(--accent);margin-bottom:25px}.v-bars{width:100%}.v-bars>div{margin:24px 0}.v-bars p{display:flex;justify-content:space-between}.track{height:13px;background:#e5e1d9;border-radius:30px;overflow:hidden}.track i{display:block;height:100%;background:var(--ink);border-radius:inherit}.track i.hot{background:var(--accent)}.v-concept{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.v-concept>b{grid-column:1/-1;margin:auto;padding:25px;border-radius:50%;border:1px solid var(--accent);font:24px Georgia,serif}.v-concept span,.v-architecture span,.v-equation span,.v-info span{padding:16px;border:1px solid var(--line);border-radius:11px}.v-layers{display:grid;gap:8px;width:100%}.v-layers span{display:grid;grid-template-columns:40px 1fr 1.5fr;gap:10px;padding:18px;border:1px solid var(--line);border-radius:10px}.tone-accent{background:var(--accent)!important;color:white}.tone-ink{background:var(--ink)!important;color:white}.v-quote{text-align:center}.v-quote i{font:80px Georgia,serif;color:var(--accent)}.v-quote blockquote{font:42px/1.1 Georgia,serif;margin:0}.v-architecture{width:100%}.v-architecture>div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v-architecture span i{font-size:9px;text-transform:uppercase;color:var(--accent)}.v-architecture ol{font-size:10px;color:var(--muted)}.v-equation{width:100%}.v-equation>b{display:block;text-align:center;padding:25px;font:30px Georgia,serif;color:var(--accent)}.v-equation>div{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.v-matrix{width:100%;overflow:auto}.v-matrix>div{display:grid}.v-matrix span,.v-matrix b{padding:11px;border:1px solid var(--line);font-size:10px}.cell-high{background:var(--accent);color:white}.cell-medium{background:var(--accent-soft)}.cell-low{background:#eeebe4}.v-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.v-info span{display:flex;gap:13px}.v-info b{font:22px Georgia,serif;color:var(--accent)}.technical{max-width:1180px;margin:auto;padding:100px max(22px,5vw)}.technical>header{margin-bottom:75px}.technical h1{font:500 clamp(50px,7vw,100px)/.9 Georgia,serif;letter-spacing:-.055em;margin:22px 0}.technical .intro{font:21px/1.65 Georgia,serif;color:#4d534b;max-width:850px}.tech-block{display:grid;grid-template-columns:170px 1fr;gap:30px;padding:45px 0;border-top:1px solid var(--line)}.tech-block h2{font:500 28px Georgia,serif;margin:0}.tech-list{display:grid;gap:10px}.tech-card{padding:25px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.tech-card h3{margin:0 0 10px;font:500 23px Georgia,serif}.formula{font:24px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);overflow:auto}.tech-card p,.tech-card li{line-height:1.65;color:#4c524a}.tech-card pre{white-space:pre-wrap;background:var(--ink);color:#e8e8df;padding:20px;border-radius:10px;overflow:auto}.empty{padding:100px 24px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.local{display:none}.download{font-size:0}.download:after{content:'JSON';font-size:11px}.topbar{gap:10px}.tabs button{padding:8px 10px;font-size:12px}.summary-grid,.tri-grid,.claims,.metrics,.report{grid-template-columns:1fr}.summary-grid article,.tri-grid article{padding:25px 0;border-right:0;border-bottom:1px solid var(--line)}.section-head,.tech-block{grid-template-columns:1fr}.story-grid{display:block}.story-copy{padding:0 22px}.story-section{min-height:auto;padding:17vh 0;opacity:1}.story-sticky{display:none}.mobile-visual{display:block;margin-top:42px}.canvas{min-height:350px;padding:22px}.v-metric{grid-template-columns:1fr}.hero{min-height:72vh}.meta{align-items:flex-end}.open ol{columns:1}.v-flow,.v-timeline{display:grid}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <div class="shell">
    <nav class="topbar"><div class="brand"><i></i>Trace</div><span class="local">Local paper studio</span><div class="tabs"><button data-tab="lab" class="active">Lab</button><button data-tab="story">Story</button><button data-tab="technical">Technical</button></div><a id="download" class="download" download>Trace JSON ↓</a></nav>
    <main id="lab" class="view active"></main>
    <main id="story" class="view"></main>
    <main id="technical" class="view"></main>
  </div>
  <script id="trace-data" type="application/json">__TRACE_PROJECT_JSON__</script>
  <script>
    const project=JSON.parse(document.getElementById('trace-data').textContent);const e=project.evidence;const s=project.story;document.documentElement.lang=project.language||'tr';document.documentElement.style.setProperty('--accent',/^#[0-9a-f]{6}$/i.test(s.accent)?s.accent:'#ed5b3b');document.title=s.title+' · Trace';
    const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:[];const claim=id=>e.claims.find(item=>item.id===id);const refs=ids=>arr(ids).map(claim).filter(Boolean).map(c=>`<details><summary>Kaynağı gör · ${h(c.sourceRefs[0]?.page?'s. '+c.sourceRefs[0].page:(c.sourceRefs[0]?.locator||'kaynak'))}</summary><p>${h(c.statement)}</p><blockquote>${h(c.sourceRefs[0]?.excerpt)}</blockquote></details>`).join('');
    const list=(title,items)=>`<article><span class="eyebrow">${h(title)}</span><ul>${arr(items).map(x=>`<li>${h(x)}</li>`).join('')}</ul></article>`;
    document.getElementById('download').href='./'+encodeURIComponent(project.id||'project')+'.trace.json';
    const report=project.deepReport;document.getElementById('lab').innerHTML=`<header class="hero"><div><span class="eyebrow">${h(e.paper.year)} · ${h(e.paper.venue)} · ${h(project.depth)}</span><h1>${h(e.paper.title)}</h1><p class="dek">${h(e.plainSummary)}</p></div><div class="meta"><span>${h(e.paper.authors.join(', '))}</span><span>${h(e.claims.length)} claim · ${h(s.readingTime)}</span></div></header><section class="lab"><div class="section-head"><span class="eyebrow">Core reading</span><h2>Araştırmanın izi</h2></div><p class="thesis">${h(e.thesis)}</p><div class="summary-grid"><article><span class="eyebrow">Question</span><h3>Araştırma sorusu</h3><p>${h(e.researchQuestion)}</p></article>${list('Method',e.methods)}${list('Findings',e.findings)}</div><div class="section-head"><span class="eyebrow">Evidence map</span><h2>İddialar ve kaynakları</h2></div><div class="claims">${e.claims.map(c=>`<article class="claim"><header><span class="tag">${h(c.kind)}</span><span class="tag ${c.confidence==='verified'?'verified':'review'}">${h(c.confidence)}</span></header><p>${h(c.statement)}</p>${refs([c.id])}</article>`).join('')}</div>${e.metrics.length?`<div class="section-head"><span class="eyebrow">Reported metrics</span><h2>Sayısal bulgular</h2></div><div class="metrics">${e.metrics.map(m=>`<article class="metric"><b>${h(m.displayValue)}</b><strong>${h(m.label)} · ${h(m.unit)}</strong><small>${h(m.context)}</small></article>`).join('')}</div>`:''}<div class="tri-grid">${list('Methods',e.methods)}${list('Findings',e.findings)}${list('Limitations',e.limitations)}</div>${report?`<div class="section-head"><span class="eyebrow">Deep report · ${h(report.readingTime)}</span><h2>${h(report.title)}</h2></div><p class="thesis">${h(report.dek)}</p><div class="report">${report.sections.map(r=>`<article><span class="eyebrow">${h(r.kind)}</span><h3>${h(r.title)}</h3><p>${h(r.summary)}</p>${r.analysis.map(p=>`<p>${h(p)}</p>`).join('')}${refs(r.claimIds)}</article>`).join('')}</div><aside class="open"><span class="eyebrow">Open questions</span><ol>${report.openQuestions.map(q=>`<li>${h(q)}</li>`).join('')}</ol></aside>`:''}</section>`;
    function visual(v){let x='';if(v.type==='metric')x=`<div class="v-metric">${v.items.map(i=>`<span><b>${h(i.value)}</b><strong>${h(i.label)}</strong><small>${h(i.note)}</small></span>`).join('')}</div>`;if(v.type==='flow')x=`<div class="v-flow">${v.items.map((i,n)=>`<span><i>${String(n+1).padStart(2,'0')}</i><strong>${h(i.label)}</strong><small>${h(i.detail)}</small></span>`).join('')}</div>`;if(v.type==='comparison'){const max=Math.max(...v.items.map(i=>i.value),1);x=`<div class="v-bars">${v.items.map(i=>`<div><p><span>${h(i.label)}</span><b>${h(i.displayValue)}</b></p><div class="track"><i class="${i.highlight?'hot':''}" style="width:${Math.max(i.value/max*100,6)}%"></i></div></div>`).join('')}</div>`}if(v.type==='concept')x=`<div class="v-concept"><b>${h(v.center)}</b>${v.items.map(i=>`<span><strong>${h(i.label)}</strong><small>${h(i.detail)}</small></span>`).join('')}</div>`;if(v.type==='layers')x=`<div class="v-layers">${v.items.map((i,n)=>`<span class="tone-${h(i.tone)}"><i>${String(n+1).padStart(2,'0')}</i><strong>${h(i.label)}</strong><small>${h(i.detail)}</small></span>`).join('')}</div>`;if(v.type==='quote')x=`<div class="v-quote"><i>∴</i><blockquote>${h(v.quote)}</blockquote><p>${h(v.attribution)}</p></div>`;if(v.type==='architecture')x=`<div class="v-architecture"><div>${v.nodes.map(n=>`<span><i>${h(n.group)}</i><strong>${h(n.label)}</strong><small>${h(n.detail)}</small></span>`).join('')}</div><ol>${v.edges.map(ed=>`<li><b>${h(ed.from)}</b> → ${h(ed.label)} → <b>${h(ed.to)}</b></li>`).join('')}</ol></div>`;if(v.type==='equation')x=`<div class="v-equation"><b>${h(v.formula)}</b><div>${v.terms.map(t=>`<span><strong>${h(t.symbol)}</strong><small>${h(t.label)} · ${h(t.detail)}</small></span>`).join('')}</div><ol>${v.steps.map(step=>`<li>${h(step)}</li>`).join('')}</ol></div>`;if(v.type==='timeline')x=`<div class="v-timeline">${v.items.map((i,n)=>`<span class="tone-${h(i.tone)}"><i>${String(n+1).padStart(2,'0')}</i><strong>${h(i.label)}</strong><small>${h(i.detail)}</small></span>`).join('')}</div>`;if(v.type==='matrix')x=`<div class="v-matrix"><div style="grid-template-columns:repeat(${v.columns.length+1},1fr)"><i></i>${v.columns.map(c=>`<b>${h(c)}</b>`).join('')}</div>${v.rows.map(r=>`<div style="grid-template-columns:repeat(${v.columns.length+1},1fr)"><b>${h(r.label)}</b>${r.cells.map(c=>`<span class="cell-${h(c.tone)}">${h(c.label)}</span>`).join('')}</div>`).join('')}</div>`;if(v.type==='infographic')x=`<div class="v-info">${v.items.map(i=>`<span><b>${h(i.badge)}</b><div><strong>${h(i.label)}</strong><small>${h(i.detail)}</small></div></span>`).join('')}</div>`;return `<article class="figure"><header>${h(v.eyebrow)}<i></i></header><div class="canvas">${x}</div><footer>${h(v.caption)}</footer></article>`}
    const storySections=s.sections.map((section,n)=>`<section id="section-${h(section.id)}" class="story-section ${n===0?'active':''}"><span class="number">${h(section.indexLabel)}</span><p class="eyebrow">${h(section.kicker)}</p><h2>${h(section.title)}</h2><p class="body">${h(section.body)}</p>${refs(section.claimIds)}<div class="mobile-visual">${visual(section.visual)}</div></section>`).join('');const storyVisuals=s.sections.map((section,n)=>`<div id="visual-${h(section.id)}" class="visual-slot ${n===0?'active':''}">${visual(section.visual)}</div>`).join('');document.getElementById('story').innerHTML=`<header class="hero"><div><span class="eyebrow">Interactive story · ${h(s.readingTime)}</span><h1>${h(s.title)}</h1><p class="dek">${h(s.dek)}</p></div><div class="meta"><span>${h(e.paper.authors.slice(0,4).join(', '))}</span><span>Scroll ↓</span></div></header><div class="story-grid"><div class="story-copy">${storySections}</div><aside class="story-sticky">${storyVisuals}</aside></div><footer class="hero"><div><span class="eyebrow">Closing</span><h1>${h(s.closing.title)}</h1><p class="dek">${h(s.closing.body)}</p></div></footer>`;
    const t=project.technicalAppendix;const techCards=(items,render)=>items.length?`<div class="tech-list">${items.map(render).join('')}</div>`:'<p class="empty">Bu paper için doğrulanmış içerik yok.</p>';document.getElementById('technical').innerHTML=t?`<section class="technical"><header><span class="eyebrow">Evidence-linked appendix</span><h1>${h(t.title)}</h1><p class="intro">${h(t.overview)}</p></header><div class="tech-block"><h2>Equations</h2>${techCards(t.equations,q=>`<article class="tech-card"><h3>${h(q.label)}</h3><p class="formula">${h(q.expression)}</p><p>${h(q.explanation)}</p><ul>${q.variables.map(v=>`<li><b>${h(v.symbol)}</b> — ${h(v.meaning)}</li>`).join('')}</ul>${refs(q.claimIds)}</article>`)}</div><div class="tech-block"><h2>Algorithm</h2>${techCards(t.algorithmSteps,(a,n)=>`<article class="tech-card"><span class="eyebrow">Step ${n+1}</span><h3>${h(a.label)}</h3><p>${h(a.detail)}</p>${refs(a.claimIds)}</article>`)}</div><div class="tech-block"><h2>Code sketches</h2>${techCards(t.codeSketches,c=>`<article class="tech-card"><h3>${h(c.title)} · ${h(c.language)}</h3><pre><code>${h(c.code)}</code></pre><p>${h(c.explanation)}</p>${refs(c.claimIds)}</article>`)}</div><div class="tech-block"><h2>Complexity</h2>${techCards(t.complexity,c=>`<article class="tech-card"><h3>${h(c.operation)}</h3><p class="formula">${h(c.cost)}</p><p>${h(c.context)}</p>${refs(c.claimIds)}</article>`)}</div><div class="tech-block"><h2>Implementation</h2>${techCards(t.implementationNotes,n=>`<article class="tech-card"><p>${h(n)}</p></article>`)}</div></section>`:`<div class="empty">Bu projede teknik ek bulunmuyor.</div>`;
    document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===button.dataset.tab));scrollTo({top:0,behavior:'smooth'})}));const sections=[...document.querySelectorAll('.story-section')],slots=[...document.querySelectorAll('.visual-slot')];const observer=new IntersectionObserver(entries=>{const hit=entries.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(!hit)return;sections.forEach(x=>x.classList.toggle('active',x===hit.target));slots.forEach(x=>x.classList.toggle('active',x.id==='visual-'+hit.target.id.replace('section-','')))},{rootMargin:'-35% 0px -40%',threshold:[0,.25,.6]});sections.forEach(x=>observer.observe(x));
  </script>
</body>
</html>
