/**
 * Trace tasarım jetonları — TEK KAYNAK.
 *
 * Hem Next uygulaması (globals.css üzerinden) hem de plugin'in bağımsız
 * viewer paketi bu dosyayı kullanır. Tailwind'e özgü `@theme inline` köprüsü
 * globals.css içinde kalır; burası saf CSS olmak zorundadır çünkü viewer
 * paketinde Tailwind yoktur.
 */
:root {
  --paper: #f2efe7;
  --surface: #fbfaf6;
  --surface-2: #f7f5ef;
  --ink: #191b18;
  --ink-soft: #454a44;
  /* Kâğıt zeminde 4,74:1, yüzeyde 5,22:1. Eski #71766f 4,04:1 ile en küçük
     etiketlerde okunmuyordu (WCAG AA normal metin için 4,5:1 istiyor). */
  --muted: #666b64;
  --line: #d8d3c9;
  --line-dark: #beb9af;
  --accent: #e75b37;
  --green: #2e7254;
  /* #a36a1e metin olarak 3,94:1 kalıyordu (rozetler, uyarılar); aynı ton, her zeminde en az 4,99:1. */
  --amber: #8c5c18;
  --shadow: 0 28px 90px rgba(48, 43, 31, 0.08);

  /*
   * Yazı ölçeği. Eskiden her kural kendi px değerini taşıyordu: 50'ye yakın
   * farklı boyut, çoğu 7–11 px. Artık küçük metin bu basamaklardan biri ve
   * hepsi rem: tarayıcının yazı boyutu tercihi de, stüdyodaki boyut seçimi de
   * her şeyi birlikte büyütüyor. 12 px taban; altına inen bir kural testte
   * (type-scale.test.ts) yakalanıyor. Daha büyük boyutlar doğrudan rem.
   */
  --text-2xs: 0.75rem;   /* 12 — üst etiketler, rozetler, meta */
  --text-xs: 0.8125rem;  /* 13 — küçük etiketler, ikincil bilgi */
  --text-sm: 0.875rem;   /* 14 — düğmeler, gezinme, arayüz metni */
  --text-md: 0.9375rem;  /* 15 — arayüzde okunan metin */
  --text-base: 1rem;     /* 16 — kartlardaki içerik */
  --text-lg: 1.0625rem;  /* 17 — iddialar, rapor paragrafları */
  --text-xl: 1.125rem;   /* 18 — öne çıkan paragraf */

  /*
   * Anlamlı renkler. Eskiden kurallarda sabit değerlerdi ("white", "#9c351d");
   * karanlık temada her biri yanlış yöne düşüyordu (beyaz alan üstünde beyaz
   * yazı). Açık temadaki değerler o sabitlerin aynısı; metin / zemin
   * çiftleri iki temada da en az 4,5:1 (`type-scale.test.ts`).
   */
  --field: #fff;              /* form alanları, beyaz kartlar */
  --on-ink: #fff;             /* --ink zeminli düğme ve kartların yazısı */
  --on-ink-soft: #c8cbc5;
  --on-ink-accent: #e99a82;
  --on-ink-line: #41443f;
  --paper-deep: #eae6dc;
  --track: #e5e1d8;
  --tone-low: #ece8df;
  --danger: #9c351d;
  --danger-strong: #8a2f1d;
  --danger-edge: #b3402a;
  --danger-line: #e6b7aa;
  --danger-bg: #f6dcd5;
  --danger-bg-soft: #fff1ec;
  --good-text: #1f5a41;
  --good-bg: #e5f1e9;
  --good-bg-strong: #dcebe2;
  --warn-text: #7a5410;
  --warn-bg: #fff2d9;
  --warn-bg-strong: #f5e6c8;
  --notice-text: #78551b;
  --notice-bg: #fff5dc;
  --notice-line: #e7d5a6;
  --del-text: #8f3a22;
  --del-bg: #f7e1da;
  --ins-text: #2f5e39;
  --ins-bg: #e0eee3;
  --done-text: #5a6a58;       /* eskisi #657563 kâğıtta 4,27:1 kalıyordu */
  --done-mark: #47704d;
  --done-line: #9baf99;
  --live: #5f9367;
}

/* Tarayıcının <small>, <sub> ve <sup> varsayılanı "smaller": 12 px'lik bir
   etiketin içinde 9,6 px (oyun alanının ölçek uçları böyleydi). Boyutunu
   kendisi belirtmeyenler için taban burada da geçerli; sınıfla boyut verilen
   öğeler daha özgül kurallarıyla etkilenmiyor. */
small, sub, sup { font-size: max(var(--text-2xs), .8em); }

/*
 * Vurgu renkleri metin olarak. Makalenin rengi 20 renklik bir paletten
 * geliyor ve çoğu açık: sarı kâğıtta 1,33:1, açık mavi 1,86:1, marka turuncusu
 * 3,07:1 (normal metin için 4,5:1 gerekiyor). Metinde rengin kendisi değil bu
 * türevleri kullanılıyor: OKLCH parlaklığı 0,5'e sınırlanıyor, ton ve doygunluk
 * aynı kalıyor. Paletin en kötüsü böylece 4,9:1; zaten koyu olanlar (lacivert,
 * bordo) değişmiyor. Dolgular, simgeler ve grafik işaretleri parlak rengi
 * kullanmaya devam ediyor.
 *
 * Her öğede hesaplanıyor: --accent çalışma alanında, --card-accent kartlarda,
 * --story-accent görsellerde makalenin rengiyle değişiyor; :root'ta bir kez
 * hesaplanan bir türev bu değişikliği görmezdi.
 */
*, ::before, ::after {
  --accent-ink: oklch(from var(--accent) min(l, .5) c h);
  --card-accent-ink: oklch(from var(--card-accent) min(l, .5) c h);
  --story-accent-ink: oklch(from var(--story-accent) min(l, .5) c h);
}

/*
 * Karanlık tema. Yalnızca stüdyo `data-theme` yazıyor: "dark" her zaman,
 * "system" işletim sistemi karanlıksa. Bağımsız görüntüleyici ve yayımlanan
 * sayfalar bu özniteliği hiç taşımıyor, açık kalıyorlar.
 *
 * Değerler iki blokta aynı (CSS bir medya sorgusunun içinden seçici
 * paylaştıramıyor); `type-scale.test.ts` ayrışmalarını yakalıyor. Her metin /
 * zemin çifti en az 5:1. Vurgu renkleri metin olarak burada koyulaşmıyor,
 * açılıyor: OKLCH parlaklığı en az 0,72, paletin en kötüsü 5,5:1.
 */
html[data-theme="dark"] {
  color-scheme: dark;
  --paper: #161714;
  --surface: #1e201c;
  --surface-2: #1a1c18;
  --field: #232521;
  --ink: #ecebe4;
  --ink-soft: #c9cbc3;
  --muted: #a0a49b;
  --line: #34372f;
  --line-dark: #4a4e44;
  --green: #7fd1a0;
  --amber: #e3ad5b;
  --shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
  --on-ink: #161714;
  --on-ink-soft: #4a4e46;
  --on-ink-accent: #b03c16;
  --on-ink-line: #c9cbc3;
  --paper-deep: #121310;
  --track: #2c2f28;
  --tone-low: #262822;
  --danger: #f0a08a;
  --danger-strong: #f3b3a2;
  --danger-edge: #e0735a;
  --danger-line: #6e3b2f;
  --danger-bg: #3a211b;
  --danger-bg-soft: #2e1c17;
  --good-text: #9edcb8;
  --good-bg: #1d3327;
  --good-bg-strong: #22402f;
  --warn-text: #f0cf8a;
  --warn-bg: #3a2e14;
  --warn-bg-strong: #3f3217;
  --notice-text: #f2d494;
  --notice-bg: #332810;
  --notice-line: #6a5424;
  --del-text: #f3b3a2;
  --del-bg: #3a211b;
  --ins-text: #a6dfb8;
  --ins-bg: #1f3a28;
  --done-text: #a8c4a6;
  --done-mark: #8fd0a0;
  --done-line: #4f6b54;
  --live: #6fbf85;
}
html[data-theme="dark"] *, html[data-theme="dark"] ::before, html[data-theme="dark"] ::after {
  --accent-ink: oklch(from var(--accent) max(l, .72) c h);
  --card-accent-ink: oklch(from var(--card-accent) max(l, .72) c h);
  --story-accent-ink: oklch(from var(--story-accent) max(l, .72) c h);
}
@media (prefers-color-scheme: dark) {
  html[data-theme="system"] {
    color-scheme: dark;
    --paper: #161714;

    --ink-soft: #c9cbc3;
    --muted: #a0a49b;
    --line: #34372f;
    --line-dark: #4a4e44;
    --green: #7fd1a0;
    --amber: #e3ad5b;
    --shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
    --on-ink: #161714;
    --on-ink-soft: #4a4e46;
    --on-ink-accent: #b03c16;
    --on-ink-line: #c9cbc3;
    --paper-deep: #121310;
    --track: #2c2f28;
    --tone-low: #262822;
    --danger: #f0a08a;
    --danger-strong: #f3b3a2;
    --danger-edge: #e0735a;
    --danger-line: #6e3b2f;
    --danger-bg: #3a211b;
    --danger-bg-soft: #2e1c17;
    --good-text: #9edcb8;
    --good-bg: #1d3327;
    --good-bg-strong: #22402f;
    --warn-text: #f0cf8a;
    --warn-bg: #3a2e14;
    --warn-bg-strong: #3f3217;
    --notice-text: #f2d494;
    --notice-bg: #332810;
    --notice-line: #6a5424;
    --del-text: #f3b3a2;
    --del-bg: #3a211b;
    --ins-text: #a6dfb8;
    --ins-bg: #1f3a28;
    --done-text: #a8c4a6;
    --done-mark: #8fd0a0;
    --done-line: #4f6b54;
    --live: #6fbf85;
  }
  html[data-theme="system"] *, html[data-theme="system"] ::before, html[data-theme="system"] ::after {
    --accent-ink: oklch(from var(--accent) max(l, .72) c h);
    --card-accent-ink: oklch(from var(--card-accent) max(l, .72) c h);

/* src/visuals/styles.css */
/**
 * Trace görsel gramerleri — TEK KAYNAK.
 *
 * src/visuals/** bileşenlerinin tamamının görünümü buradan gelir. Bu dosya
 * hem Next uygulamasına (globals.css) hem de plugin viewer paketine
 * (scripts/build-viewer.mjs) dahil edilir. Tailwind sınıfı KULLANMAYIN —
 * viewer paketinde Tailwind yoktur.
 */
.visual-frame { overflow: hidden; margin: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 28px 90px rgba(45,41,31,.08); }
.visual-topline { min-height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: var(--text-xs); font-weight: 650; text-transform: uppercase; letter-spacing: .13em; }
.visual-signal { width: 7px; height: 7px; border-radius: 50%; background: var(--story-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--story-accent) 12%, transparent); }
.visual-canvas { min-height: clamp(380px,50vh,540px); display: grid; place-items: center; padding: clamp(24px,4vw,50px); }
.visual-frame figcaption { min-height: 48px; display: flex; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--text-xs); line-height: 1.5; }
.visual-frame.is-active .metric-item, .visual-frame.is-active .flow-step, .visual-frame.is-active .layer-card, .visual-frame.is-active .concept-node { animation: visual-in .5s both; }
.visual-frame.is-active :is(.metric-item,.flow-step,.layer-card,.concept-node):nth-child(2) { animation-delay: .07s; }
.visual-frame.is-active :is(.metric-item,.flow-step,.layer-card,.concept-node):nth-child(3) { animation-delay: .14s; }
.visual-frame.is-active :is(.metric-item,.flow-step,.layer-card,.concept-node):nth-child(4) { animation-delay: .21s; }
@keyframes visual-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.metric-grid { width: 100%; display: grid; grid-template-columns: repeat(3,1fr); }
.metric-item { min-width: 0; padding: 22px; border-left: 1px solid var(--line); }
.metric-item:first-child { border-left: 0; }
.metric-value { display: block; color: var(--story-accent-ink); font: 2.75rem/1 Georgia,serif; letter-spacing: -.04em; }
.metric-item strong, .metric-item small { display: block; }
.metric-item strong { margin-top: 19px; font-size: var(--text-sm); }
.metric-item small { margin-top: 7px; color: var(--muted); font-size: var(--text-xs); }
.flow-row { width: 100%; display: flex; }
.flow-step { min-width: 0; flex: 1; position: relative; padding: 20px 9px; border-top: 1px solid var(--line-dark); }
.flow-index { display: block; margin-bottom: 35px; color: var(--story-accent-ink); font: italic var(--text-base) Georgia,serif; }
.flow-step strong, .flow-step small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-step strong { font-size: var(--text-md); }
.flow-step small { margin-top: 5px; color: var(--muted); font-size: var(--text-xs); }
.flow-line { width: 6px; height: 6px; position: absolute; top: -3px; right: -3px; border-radius: 50%; background: var(--story-accent); }
.comparison-list { width: 100%; }
.comparison-row + .comparison-row { margin-top: 30px; }
.comparison-label { display: flex; justify-content: space-between; margin-bottom: 11px; font-size: var(--text-sm); }
.comparison-label strong { font: var(--text-xl) Georgia,serif; }
.comparison-track { height: 13px; overflow: hidden; border-radius: 20px; background: var(--track); }
.comparison-track span { display: block; height: 100%; border-radius: inherit; background: var(--ink); transition: width 900ms cubic-bezier(.22,.7,.2,1); }
.comparison-track span.highlight { background: var(--story-accent); }
/* Kavram haritası bir ızgara: kutular mutlak konumdayken yazı büyüyünce
   üst üste biniyordu, beşinci öğe de birincinin üstüne düşüyordu. Çift
   sıradakiler solda, tekler sağda; merkez ilk iki satırı kaplıyor. Çizgiler
   hâlâ merkezden köşelere gidiyor, kutuların yerini bilmeleri gerekmiyor. */
.concept-map { width: 100%; min-height: 330px; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-content: center; gap: 1rem clamp(1rem, 5%, 2.5rem); }
.concept-map svg { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; }
.concept-map path { fill: none; stroke: var(--line-dark); stroke-width: 1; stroke-dasharray: 5 6; }
.concept-center { width: 8.5rem; height: 8.5rem; position: relative; z-index: 1; grid-column: 2; grid-row: 1 / span 2; align-self: center; display: grid; place-items: center; padding: .9rem; border: 1px solid var(--story-accent); border-radius: 50%; background: var(--surface); color: var(--story-accent-ink); font: var(--text-md)/1.25 Georgia,serif; text-align: center; overflow-wrap: break-word; }
.concept-node { max-width: 14rem; position: relative; z-index: 2; padding: 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow-wrap: break-word; }
.concept-node strong, .concept-node small { display: block; }
.concept-node strong { font-size: var(--text-sm); }.concept-node small { margin-top: 4px; color: var(--muted); font-size: var(--text-2xs); }
.concept-node.node-0, .concept-node.node-2 { grid-column: 1; justify-self: start; }.concept-node.node-1, .concept-node.node-3 { grid-column: 3; justify-self: end; }
.layer-stack { width: 100%; display: grid; gap: 8px; }
.layer-card { display: grid; grid-template-columns: 42px 1fr 1.2fr; align-items: center; padding: 18px; border: 1px solid var(--line); border-radius: 9px; }
.layer-card > span { color: var(--story-accent-ink); font: italic var(--text-base) Georgia,serif; }
.layer-card strong { font-size: var(--text-md); }.layer-card small { color: var(--muted); font-size: var(--text-xs); }
.layer-card.tone-accent { border-color: var(--story-accent); background: var(--story-accent); color: white; }.layer-card.tone-accent > span,.layer-card.tone-accent small { color: white; }
.layer-card.tone-ink { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }.layer-card.tone-ink small { color: var(--on-ink-soft); }
.quote-visual { text-align: center; }
.quote-mark { display: block; color: var(--story-accent); font: 4.75rem/1 Georgia,serif; }
.quote-visual blockquote { margin: 16px 0; font: 2.8125rem/1.1 Georgia,serif; letter-spacing: -.04em; }
.quote-visual p { color: var(--muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .1em; }

.architecture-visual { width: 100%; display: grid; gap: 24px; }
.architecture-nodes { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
.architecture-node { min-height: 110px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); transition: transform .2s, border-color .2s, box-shadow .2s; }
.architecture-node:hover,.architecture-node:focus { transform: translateY(-3px); border-color: var(--story-accent); box-shadow: 0 12px 30px rgba(35,31,24,.08); outline: 0; }
.architecture-node>span { color: var(--story-accent-ink); font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .12em; }
.architecture-node strong,.architecture-node small { display: block; }.architecture-node strong{margin-top:10px;font:var(--text-xl) Georgia,serif}.architecture-node small{margin-top:7px;color:var(--muted);font-size:var(--text-2xs);line-height:1.4}
.architecture-node.group-core { border-color: var(--story-accent); }.architecture-node.group-output{background:var(--ink);color:var(--on-ink)}.architecture-node.group-output small{color:var(--on-ink-soft)}
.architecture-edges { display: flex; flex-wrap: wrap; gap: 6px; }
.architecture-edges>span { display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:20px;color:var(--muted);font-size:var(--text-2xs) }.architecture-edges b{color:var(--ink);font-weight:600}.architecture-edges i{color:var(--story-accent);font-style:normal}.architecture-edges em{font-style:normal}
.equation-visual { width:100%; }.equation-formula{padding:25px;text-align:center;border-bottom:1px solid var(--line);color:var(--story-accent-ink);font:clamp(22px,3vw,38px)/1.2 Georgia,serif;overflow-wrap:anywhere}.equation-terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-top:18px}.equation-terms>div{padding:14px;border:1px solid var(--line);border-radius:8px;transition:background .2s}.equation-terms>div:hover,.equation-terms>div:focus{outline:0;background:color-mix(in srgb,var(--story-accent) 8%,var(--surface))}.equation-terms strong,.equation-terms span,.equation-terms small{display:block}.equation-terms strong{font:1.3125rem Georgia,serif}.equation-terms span{margin-top:6px;font-size:var(--text-xs)}.equation-terms small{margin-top:4px;color:var(--muted);font-size:var(--text-2xs)}.equation-visual ol{display:grid;gap:5px;margin:16px 0 0;padding:0;list-style:none}.equation-visual li{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--text-2xs)}.equation-visual li span{width:20px;height:20px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--on-ink);font-size:var(--text-2xs)}
.timeline-visual{width:100%;display:flex}.timeline-visual>div{min-width:0;flex:1;position:relative;padding:28px 11px 12px;border-top:2px solid var(--line)}.timeline-visual>div>i{width:10px;height:10px;position:absolute;top:-6px;left:10px;border-radius:50%;background:var(--line-dark)}.timeline-visual>div.tone-accent{border-color:var(--story-accent)}.timeline-visual>div.tone-accent>i{background:var(--story-accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--story-accent) 13%,transparent)}.timeline-visual span,.timeline-visual strong,.timeline-visual small{display:block}.timeline-visual span{color:var(--story-accent-ink);font:italic var(--text-sm) Georgia,serif}.timeline-visual strong{margin-top:17px;font-size:var(--text-sm);overflow-wrap:anywhere;hyphens:auto}.timeline-visual small{margin-top:6px;color:var(--muted);font-size:var(--text-2xs);line-height:1.4}
.matrix-visual{--matrix-columns:3;width:100%;display:grid;grid-template-columns:minmax(90px,.8fr) repeat(var(--matrix-columns),1fr)}.matrix-column,.matrix-corner{padding:10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:var(--text-2xs);text-align:center}.matrix-row{display:grid;grid-template-columns:minmax(90px,.8fr) repeat(var(--matrix-columns),1fr)}.matrix-row>*{min-height:55px;display:grid;place-items:center;padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:var(--text-2xs);text-align:center}.matrix-row>strong{justify-items:start;text-align:left}.matrix-row span{transition:filter .2s,transform .2s}.matrix-row span:hover,.matrix-row span:focus{z-index:1;transform:scale(1.04);filter:saturate(1.2);outline:0}.matrix-row .tone-high{background:var(--story-accent);color:white}.matrix-row .tone-medium{background:color-mix(in srgb,var(--story-accent) 25%, var(--field))}.matrix-row .tone-low{background:var(--tone-low)}.matrix-row .tone-neutral{background:var(--surface-2)}
.infographic-visual{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}.infographic-visual article{display:grid;grid-template-columns:52px 1fr;gap:13px;align-items:center;padding:15px;border:1px solid var(--line);border-radius:10px;transition:transform .2s,border-color .2s}.infographic-visual article:hover,.infographic-visual article:focus{transform:translateY(-2px);border-color:var(--story-accent);outline:0}.infographic-visual article>span{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--story-accent) 12%, var(--field));color:var(--story-accent-ink);font:var(--text-xl) Georgia,serif}.infographic-visual strong,.infographic-visual small{display:block}.infographic-visual strong{font-size:var(--text-sm)}.infographic-visual small{margin-top:6px;color:var(--muted);font-size:var(--text-2xs);line-height:1.4}

/* src/visuals/learning.css */
/**
 * Öğrenme katmanı stilleri — TEK KAYNAK.
 * Tailwind sınıfı kullanılmaz; viewer paketinde Tailwind yoktur.
 *
 * KURAL: kendi zeminini boyayan her kart kendi metin rengini de yazar.
 * Bu bileşenler koyu bir kartın (örneğin teknik ekin denklem kutusu) içine
 * gömülebiliyor; rengi miras alan açık zeminli bir kart orada beyaz üstüne
 * beyaz yazıya dönüşüyordu.
 */

/* --- Matematik ---------------------------------------------------- */
.math { font-size: 1.05em; }
.math.is-display { display: block; margin: 14px 0; text-align: center; font-size: 1.25em; }
.math math { font-family: Georgia, "Times New Roman", serif; }
.math-plain { padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--ink-soft); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; overflow-wrap: anywhere; }
.math-plain.is-display { display: block; margin: 14px 0; padding: 14px; text-align: center; font-size: 1.05em; }

/* --- Ortak interaktif iskeleti ------------------------------------ */
.interactive { margin: 22px 0; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); overflow: hidden; }
.interactive-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
.interactive-kind { display: block; margin-bottom: 8px; color: var(--accent-ink); font-size: var(--text-2xs); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; }
.interactive-head h4 { margin: 0; font: 1.28125rem/1.25 Georgia, serif; }
.interactive-head p { margin: 7px 0 0; color: var(--muted); font-size: var(--text-md); line-height: 1.6; max-width: 62ch; }
/* Makaleden gelmeyen, gösterim için seçilmiş sayılar: okuyucu bunu bilmeli. */
.illustrative-note { display: inline-block; margin-top: 10px; padding: 3px 8px; border: 1px dashed var(--line-dark); border-radius: 20px; color: var(--ink-soft); font-size: var(--text-2xs); letter-spacing: .02em; }
.interactive-reset { flex: 0 0 auto; padding: 8px 13px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink-soft); font-size: var(--text-sm); cursor: pointer; transition: 160ms ease; }
.interactive-reset:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
.interactive-reset:disabled { opacity: .35; cursor: default; }
.interactive-foot { padding: 14px 22px; border-top: 1px solid var(--line); background: var(--surface-2); }
.anchor-note { margin: 0; color: var(--muted); font-size: var(--text-sm); line-height: 1.6; }
.anchor-note:not(.is-anchored) { color: var(--amber); }

/* --- Oyun alanı ---------------------------------------------------- */
.playground-controls { display: grid; gap: 20px; padding: 22px; }
.playground-param { display: block; }
.param-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.param-label { font-size: var(--text-md); font-weight: 600; }
.param-value { color: var(--ink); font: 1.1875rem Georgia, serif; }
.param-value.is-off-paper { color: var(--amber); }
.param-track { display: block; position: relative; }
.param-track input[type="range"] { width: 100%; margin: 0; accent-color: var(--accent); cursor: pointer; }
.param-paper-tick { position: absolute; top: 50%; width: 2px; height: 16px; margin-left: -1px; transform: translateY(-50%); background: var(--ink); opacity: .45; pointer-events: none; }
.param-scale { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: var(--text-2xs); }
.param-paper-note { color: var(--ink-soft); }

.playground-outputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); border-top: 1px solid var(--line); }
.playground-output { padding: 18px 20px; border-left: 1px solid var(--line); }
.playground-output:first-child { border-left: 0; }
.playground-output strong { display: block; color: var(--accent-ink); font: 1.875rem/1 Georgia, serif; letter-spacing: -.03em; }
.playground-output span { display: block; margin-top: 10px; font-size: var(--text-sm); }
.playground-output small { display: block; margin-top: 4px; color: var(--muted); font-size: var(--text-2xs); }
.output-undefined { display: block; margin-top: 6px; color: var(--amber); font-size: var(--text-2xs); font-style: normal; }

.playground-chart { margin: 0; padding: 18px 22px 8px; border-top: 1px solid var(--line); }
.playground-chart svg { width: 100%; height: auto; }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-tick { fill: var(--muted); font-size: 8px; }
.chart-paper-line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 4; opacity: .45; }
.chart-cursor { stroke: var(--accent); stroke-width: 1.5; opacity: .8; }
.chart-series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart-series.series-0 { stroke: var(--accent); }
.chart-series.series-1 { stroke: var(--ink); }
.chart-series.series-2 { stroke: var(--green); }
.chart-series.series-3 { stroke: var(--amber); }
.playground-chart figcaption { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: var(--muted); font-size: var(--text-xs); }
.chart-key { display: inline-flex; align-items: center; gap: 6px; }
/* Çizgi örneği grafikteki çizginin kendi rengi; metin okunur tonu. İkisi ayrılmasa ya örnek çizgiden ayrışırdı ya metin okunmazdı. */
.chart-key:before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--series-color, currentColor); }
.chart-key.series-0 { --series-color: var(--accent); color: var(--accent-ink); }
.chart-key.series-1 { color: var(--ink); }
.chart-key.series-2 { color: var(--green); }
.chart-key.series-3 { color: var(--amber); }
.chart-key.is-paper { color: var(--ink-soft); }
.chart-key.is-paper:before { background: repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 7px); }

/* --- Simülasyon ---------------------------------------------------- */
.sim-stage { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px; }
.sim-node { flex: 1 1 130px; min-width: 0; padding: 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); transition: 220ms ease; }
.sim-node.is-active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(35,31,24,.07); }
.sim-node strong { display: block; font-size: var(--text-md); }
.sim-node small { display: block; margin-top: 5px; color: var(--muted); font-size: var(--text-2xs); line-height: 1.45; }

.sim-grid { --sim-columns: 4; display: grid; grid-template-columns: minmax(58px,.7fr) repeat(var(--sim-columns), 1fr); margin: 0 22px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.sim-grid-corner, .sim-grid-column { padding: 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: var(--text-2xs); text-align: center; }
.sim-grid-row { display: grid; grid-template-columns: minmax(58px,.7fr) repeat(var(--sim-columns), 1fr); grid-column: 1 / -1; }
.sim-grid-rowlabel { display: grid; place-items: center; padding: 8px; border-bottom: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: var(--text-2xs); }
.sim-grid-cell { --sim-weight: 0; display: grid; place-items: center; padding: 10px 6px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); font-size: var(--text-xs); background: color-mix(in srgb, var(--accent) calc(var(--sim-weight) * 70%), var(--surface)); color: color-mix(in srgb, white calc(var(--sim-weight) * 100%), var(--ink)); transition: background 300ms ease; }

.sim-narration { padding: 20px 22px 6px; }
.sim-step-index { color: var(--accent-ink); font: italic var(--text-md) Georgia, serif; }
.sim-narration strong { display: block; margin-top: 8px; font-size: var(--text-base); }
.sim-narration p { margin: 7px 0 0; color: var(--muted); font-size: var(--text-md); line-height: 1.6; }
.sim-controls { display: flex; align-items: center; gap: 8px; padding: 14px 22px 20px; }
.sim-controls button { padding: 8px 13px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink-soft); font-size: var(--text-sm); cursor: pointer; }
.sim-controls button:disabled { opacity: .35; cursor: default; }
.sim-controls .sim-play { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.sim-track { display: flex; gap: 4px; margin-left: auto; }
.sim-track i { width: 16px; height: 3px; border-radius: 2px; background: var(--line-dark); transition: background 200ms; }
.sim-track i.is-done { background: var(--accent); }

/* --- Veri keşfi ---------------------------------------------------- */
.explorer-search { min-width: 150px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); font-size: var(--text-sm); }
.explorer-scroll { overflow-x: auto; }
.explorer-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.explorer-table th, .explorer-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.explorer-table th { background: var(--surface-2); }
.explorer-table th button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: var(--ink); font-size: var(--text-xs); font-weight: 650; cursor: pointer; }
.explorer-table th button i { color: var(--muted); font-style: normal; font-size: var(--text-2xs); }
.explorer-table th small { color: var(--muted); font-weight: 400; }
.explorer-table .is-number { text-align: right; font-variant-numeric: tabular-nums; }
.explorer-table tbody tr:hover { background: var(--surface-2); }
.explorer-table tr.is-highlight { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.explorer-empty { color: var(--muted); text-align: center; }

/* --- Kanıt açılırı -------------------------------------------------- */
.evidence-note { margin: 0; }
.evidence-note summary { color: var(--accent-ink); font-size: var(--text-xs); cursor: pointer; }
.evidence-note p { margin: 9px 0 0; font-size: var(--text-sm); line-height: 1.6; }
.evidence-note blockquote { margin: 8px 0 0; padding-left: 11px; border-left: 2px solid var(--line-dark); color: var(--muted); font: italic var(--text-sm)/1.6 Georgia, serif; }

/* --- Ön bilgi ------------------------------------------------------ */
.primer-head h3 { margin: 0; font: 1.53125rem/1.2 Georgia, serif; }
.primer-head p { margin: 10px 0 22px; color: var(--ink-soft); font-size: var(--text-base); line-height: 1.7; max-width: 68ch; }
.primer-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.primer-item { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: var(--surface); color: var(--ink); }
.primer-item.is-open { border-color: var(--accent); }
.primer-item > button { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px; padding: 15px 17px; border: 0; background: none; text-align: left; cursor: pointer; }
.primer-index { color: var(--accent-ink); font: italic var(--text-base) Georgia, serif; }
.primer-term { font-size: var(--text-base); font-weight: 600; }
.primer-level { padding: 4px 9px; border-radius: 20px; font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .1em; }
.primer-level.level-temel { background: color-mix(in srgb, var(--green) 14%, var(--field)); color: var(--green); }
.primer-level.level-orta { background: color-mix(in srgb, var(--amber) 16%, var(--field)); color: var(--amber); }
.primer-level.level-ileri { background: color-mix(in srgb, var(--accent) 14%, var(--field)); color: var(--accent-ink); }
.primer-body { padding: 0 17px 18px 63px; }
.primer-intuition { margin: 0; font-size: var(--text-base); line-height: 1.75; }
.primer-formal { margin: 14px 0; padding: 12px; border-radius: 8px; background: var(--surface-2); }
.primer-why { margin: 12px 0 0; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.7; }
.primer-prereq { margin: 9px 0 0; color: var(--muted); font-size: var(--text-xs); }

/* --- Türetim ------------------------------------------------------- */
.derivation { margin: 20px 0; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); }
.derivation-head h4 { margin: 0; font: 1.25rem/1.25 Georgia, serif; }
.derivation-goal { margin: 9px 0 20px; color: var(--muted); font-size: var(--text-md); line-height: 1.6; }
.derivation-steps { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.derivation-step { display: grid; grid-template-columns: 28px 1fr; gap: 14px; }
.derivation-step-index { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--on-ink); font-size: var(--text-xs); }
.derivation-step-body { min-width: 0; }
.derivation-rationale { margin: 8px 0 0; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.7; }
.derivation-shapes { display: inline-block; margin-top: 8px; padding: 4px 8px; border-radius: 5px; background: var(--surface-2); color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-xs); }
.derivation-more { margin-top: 18px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink-soft); font-size: var(--text-sm); cursor: pointer; }
.derivation-more:hover { border-color: var(--accent); color: var(--accent-ink); }
.derivation-example { margin-top: 22px; padding: 17px; border-radius: 10px; background: var(--surface-2); }
.derivation-example h5 { margin: 0 0 10px; font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.example-setup { margin: 0; font-size: var(--text-md); line-height: 1.7; }
.example-walkthrough { margin: 10px 0; padding-left: 18px; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.8; }
.example-result { margin: 0; font-size: var(--text-md); }

/* --- Quiz ---------------------------------------------------------- */
.quiz-head h3 { margin: 0; font: 1.53125rem/1.2 Georgia, serif; }
.quiz-head p { margin: 10px 0 0; color: var(--ink-soft); font-size: var(--text-base); line-height: 1.7; }
.quiz-score { margin: 12px 0 0 !important; color: var(--accent-ink) !important; font-size: var(--text-md) !important; font-weight: 650; }
.quiz-list { display: grid; gap: 14px; margin: 22px 0 0; padding: 0; list-style: none; }
.quiz-question { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.quiz-prompt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; margin: 0 0 14px; font-size: var(--text-base); line-height: 1.6; }
.quiz-index { color: var(--accent-ink); font: italic var(--text-base) Georgia, serif; }
.quiz-options { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.quiz-option { padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; transition: 160ms ease; }
.quiz-option label { display: flex; align-items: flex-start; gap: 10px; font-size: var(--text-md); line-height: 1.55; cursor: pointer; }
.quiz-option input { margin-top: 2px; accent-color: var(--accent); }
.quiz-option.is-correct { border-color: var(--green); background: color-mix(in srgb, var(--green) 8%, transparent); }
/* Yanlış şık makalenin rengiyle değil hata rengiyle: açık mavi bir vurgu "yanlış" gibi görünmüyordu. */
.quiz-option.is-wrong { border-color: var(--danger-edge); background: var(--danger-bg-soft); }
.quiz-explanation { display: block; margin: 8px 0 0 26px; color: var(--muted); font-size: var(--text-xs); line-height: 1.6; }
.quiz-check { margin-top: 14px; padding: 9px 16px; border: 0; border-radius: 20px; background: var(--ink); color: var(--on-ink); font-size: var(--text-sm); cursor: pointer; }
.quiz-check:disabled { opacity: .35; cursor: default; }
.quiz-verdict { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
.quiz-verdict strong { display: block; margin-bottom: 8px; font-size: var(--text-md); }
.quiz-verdict.is-correct strong { color: var(--green); }
.quiz-verdict.is-wrong strong { color: var(--danger); }
.quiz-hint { margin: 0 0 8px; color: var(--ink-soft); font-size: var(--text-sm); line-height: 1.55; }
.quiz-reread { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 10px 0 0; font-size: var(--text-sm); }
.quiz-reread span { color: var(--muted); }
.quiz-reread a { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.quiz-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.quiz-reveal { margin-top: 14px; padding: 0; border: 0; border-bottom: 1px solid currentColor; background: none; color: var(--muted); font-size: var(--text-sm); cursor: pointer; }

/* --- Uygulama rehberi ---------------------------------------------- */
.app-guide-head h3 { margin: 0; font: 1.53125rem/1.2 Georgia, serif; }
.app-guide-head p { margin: 10px 0 22px; color: var(--ink-soft); font-size: var(--text-base); line-height: 1.7; max-width: 68ch; }
.guide-recipe { display: grid; gap: 16px; margin: 0; padding: 0; list-style: none; }
.guide-recipe > li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; }
.guide-step-index { color: var(--accent-ink); font: italic var(--text-base) Georgia, serif; }
.guide-recipe strong { font-size: var(--text-base); }
.guide-recipe p { margin: 6px 0 0; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.7; }
.guide-code { margin: 11px 0 0; padding: 15px; overflow-x: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.guide-code code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-sm); line-height: 1.7; white-space: pre; }
.guide-block { margin-top: 28px; }
.guide-block h4 { margin: 0 0 12px; font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.guide-scroll { overflow-x: auto; }
.guide-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.guide-table th, .guide-table td { padding: 10px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.guide-table thead th { background: var(--surface-2); color: var(--muted); font-size: var(--text-xs); }
.guide-table tbody th code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-sm); }
.guide-pitfalls { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.guide-pitfalls > li { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; }
.pitfall-symptom { display: block; font-size: var(--text-md); }
.pitfall-cause, .pitfall-fix { margin: 7px 0 0; color: var(--ink-soft); font-size: var(--text-sm); line-height: 1.65; }
.pitfall-cause em, .pitfall-fix em { color: var(--muted); font-style: normal; font-weight: 650; }
.guide-warning ul { display: grid; gap: 8px; margin: 0; padding: 15px 17px 15px 33px; border-left: 2px solid var(--amber); background: color-mix(in srgb, var(--amber) 7%, transparent); color: var(--ink-soft); font-size: var(--text-md); line-height: 1.65; }

/* --- Makalenin kendi şekilleri ------------------------------------- */
/* KURAL gereği kendi zeminini boyayan kart kendi metin rengini de yazar. */
.figures { display: grid; gap: 26px; }
.figure-card { margin: 0; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
/* Şekiller PDF'ten geliyor ve zemini her zaman beyaz; koyu temada kart
   içinde beyaz bir dikdörtgen yüzmesin diye çerçeve o beyazı sahiplenir. */
.figure-frame { position: relative; padding: 14px; border-radius: 9px; background: #fff; }
/* Kutuya sığdırma `max-width`/`max-height` ikilisiyle yapılıyor, `object-fit`
   ile değil: `width:100%` + `object-fit:contain` denendiğinde uzun şekiller
   yatayda kırpıldı — Transformer diyagramının "Positional Encoding" etiketleri
   kesiliyordu. Bu ikili şeklin tamamının görünmesini garanti ediyor. */
.figure-frame img { display: block; width: auto; height: auto; max-width: 100%; max-height: 900px; margin: 0 auto; cursor: zoom-in; }
.figure-card.is-expanded .figure-frame img { max-height: none; cursor: zoom-out; }
.figure-zoom { position: absolute; right: 10px; bottom: 10px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-soft); font-size: var(--text-xs); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.figure-zoom:hover { color: var(--ink); }
.figure-card figcaption { margin-top: 15px; }
.figure-why { margin: 0; font-size: var(--text-base); line-height: 1.7; color: var(--ink); }
.figure-caption { margin: 9px 0 0; font-size: var(--text-sm); line-height: 1.65; color: var(--ink-soft); }
.figure-label { margin-right: 7px; font-weight: 650; color: var(--muted); }
.figure-source { display: inline-block; margin-top: 9px; font-size: var(--text-xs); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

/* --- Hikâye içindeki deneme alanı --------------------------------- */
.story-practice { max-width: 900px; margin: 60px auto 0; padding: 50px 22px 0; border-top: 1px solid var(--line); }
.story-practice h2 { margin: 0 0 26px; font: 400 1.625rem/1.25 Georgia, serif; }

@media (max-width: 760px) {
  .interactive-head { flex-direction: column; }
  .playground-outputs { grid-template-columns: 1fr 1fr; }
  .playground-output { border-left: 0; border-top: 1px solid var(--line); }
  .primer-body { padding-left: 17px; }
}

@media (prefers-reduced-motion: reduce) {
  .sim-node, .sim-grid-cell, .sim-track i { transition: none !important; }
}

/* --- Kanıt sağlığı -------------------------------------------------- */
/* Tek bir "sağlık puanı" yok: birleştirilmiş bir sayı kötü kanıtı iyi
   kanıtla ortalayıp gizlerdi. Üç ayrı ölçü, üç ayrı soru cevaplıyor. */
.health-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.health-check-quotes { margin-top: 12px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: var(--text-md); cursor: pointer; }
.health-check-quotes:hover { border-color: var(--accent); }
.health-unused small { margin-left: 6px; color: var(--muted); font-size: var(--text-xs); white-space: nowrap; }
.health-stat { padding: 17px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.health-stat strong { display: block; font: 400 1.6875rem/1 Georgia, serif; }
.health-stat > span { display: block; margin-top: 6px; font-size: var(--text-xs); letter-spacing: .11em; text-transform: uppercase; color: var(--muted); }
.health-meter { height: 3px; margin: 13px 0 11px; border-radius: 999px; background: var(--line); overflow: hidden; }
.health-meter i { display: block; height: 100%; border-radius: 999px; }
.health-meter i.is-good { background: var(--green); }
.health-meter i.is-fair { background: var(--amber); }
.health-meter i.is-weak { background: var(--accent); }
.health-stat small { display: block; font-size: var(--text-sm); line-height: 1.6; color: var(--ink-soft); }
.health-block { margin-top: 30px; }
.health-block h4 { margin: 0 0 8px; font-size: var(--text-sm); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.health-note { margin: 0 0 14px; max-width: 74ch; font-size: var(--text-md); line-height: 1.7; color: var(--ink-soft); }
.health-sources { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.health-sources li { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; background: var(--surface); font-size: var(--text-md); }
.health-sources li.is-unused .health-source-title { color: var(--muted); }
.health-source-type { font-size: var(--text-2xs); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.health-source-type.type-paper { color: var(--green); }
.health-source-title { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.health-source-count { font-size: var(--text-sm); color: var(--muted); }
.health-pages { display: flex; flex-wrap: wrap; gap: 6px; }
.health-pages span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); font-size: var(--text-sm); color: var(--ink-soft); }
.health-thin { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.health-thin li { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: baseline; padding: 12px 15px; border: 1px solid var(--line); border-left: 2px solid var(--amber); border-radius: 10px; }
.health-area { font-size: var(--text-2xs); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.health-thin-title { font-size: var(--text-md); line-height: 1.5; color: var(--ink); }
.health-thin-count { font-size: var(--text-sm); color: var(--muted); white-space: nowrap; }
.health-unused { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.health-unused li { border: 1px solid var(--line); border-radius: 10px; }
.health-unused button, .health-unused p { display: block; width: 100%; margin: 0; padding: 12px 15px; border: 0; background: none; color: var(--ink-soft); font: inherit; font-size: var(--text-md); line-height: 1.65; text-align: left; }
.health-unused button { cursor: pointer; }
.health-unused button:hover { color: var(--ink); background: var(--surface-2); }

@media (max-width: 760px) {
  .health-stats { grid-template-columns: 1fr; }
  .health-thin li, .health-sources li { grid-template-columns: 1fr; gap: 5px; }
}

/* Hikâye sütunundaki şekiller. Sütun dar ve okuma akışını kesmemeleri
   gerekiyor: kart çerçevesiz, yükseklik sınırlı — okuyucu isterse
   "tam boyut" düğmesiyle açar. */
.story-section .figures,
.viewer-story-section .figures { margin: 26px 0; gap: 20px; }
.story-section .figure-card,
.viewer-story-section .figure-card { padding: 0; border: 0; background: none; }
.story-section .figure-frame img,
.viewer-story-section .figure-frame img { max-height: 460px; }
.story-section .figure-card.is-expanded .figure-frame img,
.viewer-story-section .figure-card.is-expanded .figure-frame img { max-height: none; }

/* --- Kalıcı bağlantı ------------------------------------------------ */
.permalink { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 7px; color: var(--muted); font-size: var(--text-md); line-height: 1; text-decoration: none; transition: color .15s, background .15s, opacity .15s; }
.permalink:hover { color: var(--accent-ink); background: var(--surface-2); }
.permalink.is-copied { color: var(--green); }
/* Başlık yanındaki bağlantı yalnızca üzerine gelince görünür: her başlıkta
   duran bir "#" işareti hikâyeyi teknik dokümana çevirirdi. */
.story-section h2 .permalink,
.viewer-story-section h2 .permalink { margin-left: 8px; vertical-align: middle; opacity: 0; }
.story-section h2:hover .permalink,
.story-section h2:focus-within .permalink,
.viewer-story-section h2:hover .permalink,
.viewer-story-section h2:focus-within .permalink { opacity: 1; }
@media (min-width: 761px) {
  .health-thin li:has(.health-strengthen) { grid-template-columns: 62px 1fr auto auto; }
}
.health-strengthen { justify-self: start; padding: 4px 9px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink); cursor: pointer; font-size: var(--text-sm); white-space: nowrap; }
.health-strengthen:hover { border-color: var(--accent); color: var(--accent-ink); }

/* Metnin içinde açılan terimler: tanım paragrafın altında, yerinde açılıyor. */
.term-mark { display: inline; padding: 0; border: 0; border-bottom: 1px dotted currentColor; background: none; color: inherit; font: inherit; line-height: inherit; letter-spacing: inherit; cursor: help; }
.term-mark:hover, .term-mark[aria-expanded="true"] { color: var(--accent-ink); border-bottom-style: solid; }
.term-card { display: grid; gap: 6px; margin: 4px 0 18px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; background: var(--surface); color: var(--ink); }
.term-card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.term-card-head strong { font-size: var(--text-md); }
.term-card-head button { width: 26px; height: 26px; flex: 0 0 auto; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; font-size: var(--text-md); line-height: 1; }
.term-card-body { display: block; color: var(--ink-soft); font-size: var(--text-sm); line-height: 1.6; }
.term-prerequisites { margin: 2px 0 12px; }
.term-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--text-xs); }
.term-chips > span { color: var(--muted); }
.term-chip { padding: 3px 9px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); color: var(--ink); cursor: pointer; font-size: var(--text-xs); }
.term-chip:hover, .term-chip[aria-expanded="true"] { border-color: var(--accent); }

/* --- Rehberli çalışma ------------------------------------------------ */
.study { max-width: 860px; scroll-margin-top: 84px; }
.study-head { position: relative; margin-bottom: 26px; }
.study-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .12em; }
.study-phase { color: var(--accent-ink); font-weight: 650; }
.study-bar { height: 6px; margin: 10px 0 12px; overflow: hidden; border-radius: 6px; background: var(--surface-2); }
.study-bar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s ease; }
.study-outline > summary { width: fit-content; color: var(--ink-soft); font-size: var(--text-sm); cursor: pointer; }
.study-outline ol { margin: 10px 0 0; padding: 8px; list-style: none; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); max-height: 360px; overflow-y: auto; }
.study-outline button { width: 100%; display: grid; grid-template-columns: 30px 118px minmax(0, 1fr); align-items: baseline; gap: 8px; padding: 7px 8px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-size: var(--text-sm); }
.study-outline button:hover { background: var(--surface-2); }
.study-outline button[aria-current="step"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
.study-outline button > span { color: var(--muted); font-variant-numeric: tabular-nums; }
.study-outline button.is-done > span { color: var(--green); }
.study-outline b { color: var(--muted); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.study-outline em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.study-title { margin: 6px 0 14px; font: 1.875rem/1.2 Georgia, serif; }
.study-subhead { margin: 28px 0 10px; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.study-question { margin: 0; font: 1.3125rem/1.55 Georgia, serif; }
.study-thesis { margin: 22px 0 0; padding: 16px 18px; border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; background: var(--surface-2); }
.study-thesis span { color: var(--muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .12em; }
.study-thesis p { margin: 6px 0 0; font-size: var(--text-md); line-height: 1.65; }
.study-ahead { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.study-ahead li { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: var(--text-md); }
.study-ahead b { color: var(--accent-ink); font-size: var(--text-xs); font-weight: 650; text-transform: uppercase; letter-spacing: .1em; padding-top: 3px; }
.study-kicker { color: var(--muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .12em; }
.study .primer-body { padding: 0; }
.study-prose p { margin: 0 0 16px; font: var(--text-lg)/1.75 Georgia, serif; }
.study-visual { margin: 22px 0; }
.study-check { margin-top: 30px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.study-check .quiz-list { margin-bottom: 0; }
.study-saved { margin: 10px 0 0; color: var(--ink-soft); font-size: var(--text-md); }
.study-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.study-next { padding: 11px 20px; border: 0; border-radius: 22px; background: var(--ink); color: var(--on-ink); font-size: var(--text-base); cursor: pointer; }
.study-next:hover { opacity: .88; }
.study-back { padding: 10px 16px; border: 1px solid var(--line); border-radius: 22px; background: transparent; color: var(--ink-soft); font-size: var(--text-sm); cursor: pointer; }
.study-back:disabled { opacity: .4; cursor: default; }
.study-reset { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-soft); font-size: var(--text-sm); }
.study-reset button { padding: 8px 14px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink); cursor: pointer; font-size: var(--text-sm); }
.study-reset .study-danger { border-color: var(--danger-edge); background: var(--danger-bg-soft); color: var(--danger); }
.study-note { margin: 14px 0 0; color: var(--muted); font-size: var(--text-sm); line-height: 1.55; }
.study-result { margin: 0 0 8px; font-size: var(--text-md); line-height: 1.6; }
.study-revisit > p { margin: 0 0 10px; color: var(--ink-soft); font-size: var(--text-sm); }
.study-clear { margin: 16px 0 0; padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--green) 10%, var(--surface)); font-size: var(--text-md); }
.study-jumps { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.study-jumps button { width: 100%; display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; font-size: var(--text-md); }
.study-jumps button:hover { border-color: var(--accent); }
.study-more { margin: 8px 0 0; color: var(--muted); font-size: var(--text-sm); }
.study-jumps b { color: var(--muted); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
@media (max-width: 760px) {
  .study-title { font-size: 1.5rem; }
  .study-ahead li, .study-jumps button { grid-template-columns: 1fr; gap: 3px; }
  .study-outline button { grid-template-columns: 26px minmax(0, 1fr); }
  .study-outline b { display: none; }
  .study-check { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .study-bar i { transition: none; }
}

/* --- Sık yapılan yanlış okumalar ------------------------------------- */
.misreadings { margin: 34px 0; }
.misreading-list { display: grid; gap: 12px; margin: 18px 0 0; padding: 0; list-style: none; }
.misreading { padding: 16px 18px; border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 12px; background: var(--surface); color: var(--ink); }
.misreading.is-open { border-left-color: var(--green); }
.misreading-trap { display: inline-block; padding: 3px 9px; border-radius: 20px; background: color-mix(in srgb, var(--amber) 14%, var(--field)); color: var(--amber); font-size: var(--text-2xs); letter-spacing: .1em; text-transform: uppercase; }
.misreading .misreading-text { margin: 10px 0 0; font: var(--text-lg)/1.6 Georgia, serif; }
.misreading .misreading-label { margin-right: 4px; color: var(--muted); font-size: var(--text-sm); font-style: italic; }
/* Açılınca yanlış cümle üstü çizili kalıyor: okuyucu neyin yanlış olduğunu da görmeye devam ediyor. */
.misreading.is-open .misreading-sentence { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--danger) 55%, transparent); }
.misreading-reveal { margin-top: 12px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink); cursor: pointer; font-size: var(--text-sm); }
.misreading-reveal:hover { border-color: var(--accent); color: var(--accent-ink); }
.misreading-correction { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.misreading-correction strong { color: var(--green); font-size: var(--text-sm); }
.misreading .misreading-correction > p { margin: 6px 0 10px; font-size: var(--text-md); line-height: 1.65; }

/* viewer/shell.css */
/** Bağımsız viewer kabuğu. Next uygulamasının chrome'undan bağımsızdır. */

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--text-xl)/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

.viewer-shell { min-height: 100vh; display: flex; flex-direction: column; }
.viewer-topbar { height: 62px; position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 18px; padding: 0 22px; border-bottom: 1px solid var(--line); background: rgba(251,250,246,.94); backdrop-filter: blur(18px); }
.viewer-brand { display: flex; align-items: center; gap: 9px; font: 600 var(--text-lg) Georgia, serif; }
.viewer-brand i { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); }
.viewer-brand i:after { content: "T"; color: white; font: italic 14px Georgia, serif; }
.viewer-local { color: var(--muted); font-size: var(--text-sm); }
.viewer-tabs { display: flex; gap: 3px; margin-left: auto; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
.viewer-tabs button { padding: 8px 14px; border: 0; border-radius: 7px; background: none; color: var(--ink-soft); font-size: var(--text-md); cursor: pointer; transition: 160ms ease; }
.viewer-tabs button.is-active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 4px rgba(35,31,24,.09); }
.viewer-download { padding: 8px 13px; border: 1px solid var(--line); border-radius: 20px; color: var(--ink-soft); font-size: var(--text-sm); text-decoration: none; }
.viewer-download:hover { border-color: var(--accent); color: var(--accent-ink); }

/* Stüdyo köprüsü. Ana eylem olduğu için dolu, indirme bağlantısı ise çerçeveli. */
.viewer-actions { display: flex; align-items: center; gap: 9px; }
.viewer-studio { padding: 8px 14px; border: 1px solid var(--ink); border-radius: 20px; background: var(--ink); color: var(--paper); font: inherit; font-size: var(--text-sm); text-decoration: none; cursor: pointer; transition: 160ms ease; }
.viewer-studio:hover { border-color: var(--accent); background: var(--accent); }

/* Stüdyo şeridi: sayfanın en görünür yerinde, kapatılabilir değil —
   :3000'daki asıl ekran ürünün ana yüzeyi ve buraya düşen kullanıcı onu
   bulamadan kalmamalı. */
.viewer-studio-banner { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 13px 22px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 17%, var(--paper)); }
.viewer-studio-banner p { margin: 0; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.6; }
.viewer-studio-banner button { flex: 0 0 auto; padding: 8px 15px; border: 1px solid var(--ink); border-radius: 20px; background: var(--ink); color: var(--paper); font: inherit; font-size: var(--text-sm); cursor: pointer; transition: 160ms ease; }
.viewer-studio-banner button:hover { border-color: var(--accent); background: var(--accent); }

.viewer-command { margin: 0 0 14px; border-radius: 9px; overflow: hidden; background: #1b1d1a; }
.viewer-command pre { margin: 0; padding: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: #e6e9e2; font: var(--text-md)/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
.viewer-command button { width: 100%; padding: 10px; border: 0; border-top: 1px solid #34382f; background: transparent; color: #c8cbc5; font: inherit; font-size: var(--text-sm); cursor: pointer; transition: 160ms ease; }
.viewer-command button:hover { background: #24261f; color: #fff; }
.viewer-command button.is-copied { color: #8fd0a8; }

.viewer-studio-overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 22px; background: rgba(25,27,24,.44); backdrop-filter: blur(3px); }
.viewer-studio-panel { max-width: 560px; padding: 28px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(35,31,24,.22); }
.viewer-studio-panel h2 { margin: 0 0 10px; font: 1.375rem/1.25 Georgia, serif; }
.viewer-studio-panel p { margin: 0 0 14px; color: var(--ink-soft); font-size: var(--text-base); line-height: 1.7; }
.viewer-studio-note { font-size: var(--text-md); }
.viewer-studio-buttons { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.viewer-studio-buttons a { color: var(--accent-ink); font-size: var(--text-md); text-decoration: none; }
.viewer-studio-buttons a:hover { text-decoration: underline; }
.viewer-studio-buttons button { padding: 8px 15px; border: 1px solid var(--line); border-radius: 20px; background: transparent; color: var(--ink-soft); font-size: var(--text-md); cursor: pointer; }
.viewer-studio-buttons button:hover { border-color: var(--accent); color: var(--accent-ink); }

.viewer-main { flex: 1; }
.viewer-page { max-width: 900px; margin: 0 auto; padding: clamp(34px, 5vw, 68px) 22px 90px; }
.viewer-page-head h1 { margin: 0; font: 400 clamp(28px, 4vw, 42px)/1.15 Georgia, serif; letter-spacing: -.02em; }
.viewer-byline { margin: 12px 0 0; color: var(--muted); font-size: var(--text-md); }
.viewer-block { margin-top: 42px; }
.viewer-block > h2 { margin: 0 0 14px; font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); }
.viewer-block > h3 { margin: 26px 0 10px; font: 1.1875rem Georgia, serif; }
.viewer-block p { margin: 0 0 14px; font-size: var(--text-lg); line-height: 1.75; }
.viewer-lead { font: 400 1.1875rem/1.65 Georgia, serif !important; }
.viewer-eyebrow { display: block; margin-bottom: 9px; color: var(--accent-ink); font-size: var(--text-2xs); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; }

.viewer-tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.viewer-tri article { padding: 20px; background: var(--surface); }
.viewer-tri ul { margin: 0; padding-left: 17px; }
.viewer-tri li { margin-bottom: 9px; font-size: var(--text-md); line-height: 1.65; }

.viewer-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
.viewer-metrics article { padding: 17px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.viewer-metrics strong { display: block; color: var(--accent-ink); font: 1.625rem/1 Georgia, serif; }
.viewer-metrics span { display: block; margin-top: 9px; font-size: var(--text-sm); }
.viewer-metrics small { display: block; margin: 6px 0 9px; color: var(--muted); font-size: var(--text-xs); line-height: 1.5; }

.viewer-claims { display: grid; gap: 9px; }
.viewer-claims article { padding: 17px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
.viewer-claims article.is-review { border-color: var(--amber); }
.viewer-claim-kind { display: inline-block; margin-bottom: 9px; padding: 3px 9px; border-radius: 20px; background: var(--surface-2); color: var(--muted); font-size: var(--text-2xs); text-transform: uppercase; letter-spacing: .1em; }
.viewer-claims p { margin: 0 0 9px; font-size: var(--text-base); line-height: 1.7; }

.viewer-report-section { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.viewer-report-section h3 { margin: 0 0 10px; font: 1.28125rem Georgia, serif; }
.viewer-summary { color: var(--ink-soft); font-style: italic; }
.viewer-questions { padding-left: 20px; }
.viewer-questions li { margin-bottom: 11px; font-size: var(--text-base); line-height: 1.7; }

.viewer-glossary { display: grid; gap: 12px; margin: 0; }
.viewer-glossary dt { font-size: var(--text-base); font-weight: 650; }
.viewer-glossary dd { margin: 5px 0 0; color: var(--ink-soft); font-size: var(--text-md); line-height: 1.65; }

.viewer-equation { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--line); }
.viewer-equation h3 { margin: 0 0 12px; font: var(--text-xl) Georgia, serif; }
.viewer-variables { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 14px 0; }
.viewer-variables dt { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--text-md); color: var(--accent-ink); }
.viewer-variables dd { margin: 4px 0 0; color: var(--muted); font-size: var(--text-sm); line-height: 1.55; }
.viewer-algorithm { padding-left: 20px; }
.viewer-algorithm li { margin-bottom: 14px; }
.viewer-algorithm strong { font-size: var(--text-base); }
.viewer-algorithm p { margin: 5px 0 0; color: var(--ink-soft); font-size: var(--text-md); }
.viewer-notes { padding-left: 20px; }
.viewer-notes li { margin-bottom: 9px; font-size: var(--text-md); line-height: 1.7; }

/* --- Hikâye --------------------------------------------------------- */
.viewer-story-head { max-width: 780px; margin: 0 auto; padding: clamp(50px, 8vw, 100px) 22px 40px; text-align: center; }
.viewer-story-head h1 { margin: 0; font: 400 clamp(32px, 5vw, 54px)/1.1 Georgia, serif; letter-spacing: -.03em; }
.viewer-story-head p { margin: 18px 0 0; color: var(--ink-soft); font-size: var(--text-xl); line-height: 1.7; }
.viewer-story-head small { display: block; margin-top: 16px; color: var(--muted); font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .12em; }
.viewer-story-grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(30px, 5vw, 70px); padding: 0 22px; }
.viewer-story-copy { min-width: 0; }
.viewer-story-section { min-height: 82vh; display: flex; flex-direction: column; justify-content: center; padding: 6vh 0; }
.viewer-story-section h2 { margin: 0 0 16px; font: 400 clamp(22px, 2.6vw, 32px)/1.25 Georgia, serif; letter-spacing: -.02em; }
.viewer-story-section p { margin: 0 0 15px; font-size: var(--text-lg); line-height: 1.8; }
.viewer-story-sticky { position: sticky; top: 92px; height: fit-content; align-self: start; padding: 8vh 0; }
.viewer-mobile-visual { display: none; margin-top: 30px; }
.viewer-story-closing { max-width: 700px; margin: 60px auto 0; padding: 50px 22px 100px; text-align: center; border-top: 1px solid var(--line); }
.viewer-story-closing h2 { margin: 0 0 16px; font: 400 1.625rem Georgia, serif; }
.viewer-story-closing p { margin: 0; color: var(--ink-soft); font-size: var(--text-lg); line-height: 1.8; }
.viewer-story .viewer-block { max-width: 900px; margin: 40px auto 0; padding: 0 22px; }

.viewer-fatal { max-width: 640px; margin: 100px auto; padding: 22px; border: 1px solid var(--accent); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: var(--text-lg); line-height: 1.7; }

@media (max-width: 980px) {
  .viewer-tri { grid-template-columns: 1fr; }
  .viewer-story-grid { display: block; }
  .viewer-story-sticky { display: none; }
  .viewer-story-section { min-height: auto; padding: 7vh 0; }
  .viewer-mobile-visual { display: block; }
}

@media (max-width: 700px) {
  .viewer-local { display: none; }
  .viewer-topbar { gap: 10px; padding: 0 14px; }
  .viewer-tabs button { padding: 7px 10px; font-size: var(--text-sm); }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * , *:before, *:after { transition: none !important; animation: none !important; }
}

/* Kalıcı bağlantılar. Sayfa tek dosya ve sunucusu yok; adres çubuğundaki
   hash, "şu iddiaya bak" demenin tek yolu — o yüzden her iddianın ve her
   bölümün kendi çapası var. */
.viewer-claims article { position: relative; }
.viewer-claim-kind { display: inline-flex; align-items: center; gap: 4px; }
.viewer-claims .permalink { opacity: 0; }
.viewer-claims article:hover .permalink,
.viewer-claims article:focus-within .permalink,
.viewer-claims article:target .permalink { opacity: 1; }
/* Bağlantıyla gelinen iddia kendini belli etsin: aksi hâlde okuyucu uzun
   bir listenin ortasına düşüyor ve hangisi olduğunu anlamıyor. */
.viewer-claims article:target { border-color: var(--accent); background: var(--surface-2); }
